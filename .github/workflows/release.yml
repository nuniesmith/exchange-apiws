name: Release crate

on:
  workflow_dispatch:
    inputs:
      new-version:
        description: "New version, e.g. 1.2.3"
        required: true

permissions:
  contents: write
  actions: write # to dispatch ci.yml on the new tag

env:
  MANIFEST_DIR: "."
  WORKSPACE_MODE: "false"
  INTERNAL_CRATES: ""
  TAG_PREFIX: "v"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        uses: nuniesmith/actions/.github/actions/crate-version-bump@v1
        with:
          new-version: ${{ inputs.new-version }}
          manifest-dir: ${{ env.MANIFEST_DIR }}
          workspace-mode: ${{ env.WORKSPACE_MODE }}
          internal-crates: ${{ env.INTERNAL_CRATES }}

      - name: Commit, tag and push
        run: |
          set -euo pipefail
          TAG="${{ env.TAG_PREFIX }}${{ inputs.new-version }}"
          git add -A
          git commit -m "release: $TAG" || echo "nothing to commit"
          git tag "$TAG"
          git push origin HEAD
          git push origin "$TAG"

      # A push made with this workflow's own token starts no other workflow,
      # so the tag push above never reaches ci.yml or its publish job: 0.12.0
      # was tagged on 2026-10-18 and published only after the tag was
      # re-pushed by hand. A workflow_dispatch is the one event that token
      # may start, and on a tag ref ci.yml runs every gate, then publishes.
      - name: Run CI and publish on the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${{ env.TAG_PREFIX }}${{ inputs.new-version }}"
